<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Briefboard Local preview</title>
  <desc id="desc">A static preview of Briefboard Local turning messy kickoff notes into a structured brief and a Codex-ready prompt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="0.55" stop-color="#f4f1ea"/>
      <stop offset="1" stop-color="#e7eefc"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#0d6efd"/>
      <stop offset="1" stop-color="#0b4db3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#111827" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1110" cy="96" r="210" fill="#0d6efd" opacity="0.10"/>
  <circle cx="130" cy="650" r="180" fill="#0b4db3" opacity="0.08"/>

  <text x="80" y="86" fill="#0b4db3" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" letter-spacing="4">BRIEFBOARD LOCAL</text>
  <text x="80" y="138" fill="#16202a" font-family="Georgia, 'Iowan Old Style', serif" font-size="52" font-weight="700">Messy context into a Codex-ready brief</text>
  <text x="82" y="176" fill="#66727d" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">Browser-only, localStorage-backed, no backend setup.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="238" width="330" height="390" rx="26" fill="#fffdf8" stroke="#d9d2c6"/>
    <text x="110" y="286" fill="#16202a" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">Kickoff notes</text>
    <text x="110" y="322" fill="#66727d" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">Scattered inputs before an agent run</text>

    <rect x="110" y="362" width="250" height="18" rx="9" fill="#d9d2c6"/>
    <rect x="110" y="398" width="210" height="18" rx="9" fill="#d9d2c6"/>
    <rect x="110" y="434" width="270" height="18" rx="9" fill="#d9d2c6"/>
    <rect x="110" y="490" width="88" height="30" rx="15" fill="#f4f1ea" stroke="#d9d2c6"/>
    <rect x="214" y="490" width="112" height="30" rx="15" fill="#f4f1ea" stroke="#d9d2c6"/>
    <rect x="110" y="548" width="250" height="52" rx="16" fill="#11161c"/>
    <text x="130" y="581" fill="#eef3f7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">constraints, risks...</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="490" y="238" width="330" height="390" rx="26" fill="#fffdf8" stroke="#d9d2c6"/>
    <text x="520" y="286" fill="#16202a" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">Structured brief</text>
    <text x="520" y="322" fill="#66727d" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">Audience, problem, stack, acceptance</text>

    <rect x="520" y="360" width="260" height="42" rx="16" fill="#eef3f7"/>
    <text x="540" y="386" fill="#16202a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">## Problem</text>
    <rect x="520" y="422" width="260" height="42" rx="16" fill="#eef3f7"/>
    <text x="540" y="448" fill="#16202a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">## Acceptance</text>
    <rect x="520" y="484" width="260" height="42" rx="16" fill="#eef3f7"/>
    <text x="540" y="510" fill="#16202a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">## Rollout risks</text>
    <rect x="520" y="560" width="88" height="34" rx="17" fill="url(#blue)"/>
    <rect x="620" y="560" width="122" height="34" rx="17" fill="#eef3f7" stroke="#cfd8e3"/>
    <text x="548" y="582" fill="#ffffff" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">Copy</text>
    <text x="646" y="582" fill="#16202a" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">Download</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="900" y="238" width="330" height="390" rx="26" fill="#11161c" stroke="#243040"/>
    <text x="930" y="286" fill="#eef3f7" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">Codex prompt</text>
    <text x="930" y="322" fill="#aeb9c5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">Smallest credible build, explicit checks</text>

    <text x="930" y="376" fill="#80b7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">You are helping me build...</text>
    <text x="930" y="414" fill="#eef3f7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Audience: support team</text>
    <text x="930" y="452" fill="#eef3f7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Constraints: local-first</text>
    <text x="930" y="490" fill="#eef3f7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Verification: explicit</text>
    <rect x="930" y="548" width="92" height="38" rx="19" fill="url(#blue)"/>
    <rect x="1034" y="548" width="128" height="38" rx="19" fill="#eef3f7"/>
    <text x="962" y="572" fill="#ffffff" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">Copy</text>
    <text x="1062" y="572" fill="#16202a" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">Export</text>
  </g>

  <path d="M426 432 C448 420 462 420 474 432" fill="none" stroke="#0d6efd" stroke-width="6" stroke-linecap="round"/>
  <path d="M474 432 L459 421 M474 432 L459 443" fill="none" stroke="#0d6efd" stroke-width="6" stroke-linecap="round"/>
  <path d="M836 432 C858 420 872 420 884 432" fill="none" stroke="#0d6efd" stroke-width="6" stroke-linecap="round"/>
  <path d="M884 432 L869 421 M884 432 L869 443" fill="none" stroke="#0d6efd" stroke-width="6" stroke-linecap="round"/>
</svg>
