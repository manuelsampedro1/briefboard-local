name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run formatter tests
        run: npm test
      - name: Build static app
        run: npm run build
      - name: Lint static scripts
        run: npm run lint
